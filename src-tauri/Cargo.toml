[package]
name = "worktrunk-deck"
version = "0.1.0"
description = "A cross-platform desktop dashboard for git worktrees managed by worktrunk (git-wt)"
authors = ["worktrunk-deck contributors"]
license = "MIT"
repository = "https://github.com/worktrunk-deck/worktrunk-deck"
edition = "2021"
rust-version = "1.82"

[lib]
name = "worktrunk_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "time"] }
portable-pty = "0.9"
base64 = "0.22"

[features]
# Integration tests that require a real `git-wt` on PATH (plan §8).
gitwt-integration = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
