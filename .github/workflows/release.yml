name: Release

# Tag a commit (e.g. `git tag v0.1.0 && git push --tags`) to produce installers for all three
# platforms. v1 ships **unsigned** — signing and notarization are post-v1 (plan §7), so the
# release notes must carry the de-quarantine steps in README "Installing an unsigned build".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            # A universal binary so one download covers both Apple Silicon and Intel.
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "worktrunk-deck ${{ github.ref_name }}"
          releaseBody: |
            Cross-platform desktop dashboard for [worktrunk](https://worktrunk.dev).

            Requires `git-wt` installed and on your PATH.

            These builds are **unsigned**. See the README section
            "Installing an unsigned build" for the per-OS steps to open them.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
