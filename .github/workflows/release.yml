name: Release

# Tag a commit (e.g. `git tag v0.1.0 && git push --tags`) to publish installers.
#
# Windows and Linux only, deliberately. All three platforms build fine in CI — macOS is not
# excluded for technical reasons — but an unsigned macOS bundle fails Gatekeeper with
# "worktrunk-deck is damaged and can't be opened", which reads as a corrupt download rather than
# a security prompt, and generates bug reports instead of `xattr` invocations. Windows'
# SmartScreen at least states plainly what it is doing, and Linux has no gatekeeping at all.
#
# To add macOS later you need an Apple Developer Program membership for a Developer ID
# certificate and notarization — not a Mac, since the runners build it. Re-add the
# `macos-latest` matrix entry with `--target universal-apple-darwin` and supply the signing
# secrets; until then macOS users build from source, which the README covers.
#
# Windows and Linux bundles are still unsigned, so the release notes below carry the steps to
# open them. They live here rather than in the README: someone downloading a binary is reading
# the release page, not the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "worktrunk-deck ${{ github.ref_name }}"
          releaseBody: |
            Cross-platform desktop dashboard for [worktrunk](https://worktrunk.dev).

            Requires [worktrunk](https://worktrunk.dev) (`git-wt`) ≥ 0.60 installed and on your
            PATH. The app will walk you through installing it if it is missing.

            ### Windows and Linux

            **These builds are unsigned**, so your OS will object the first time:

            - **Windows** — SmartScreen shows "Windows protected your PC". Choose
              **More info → Run anyway**.
            - **Linux** — mark the AppImage executable: `chmod +x worktrunk-deck_*.AppImage`

            ### macOS

            No macOS build is published yet. It compiles fine, but an unsigned bundle fails
            Gatekeeper with "worktrunk-deck is damaged and can't be opened" — which looks like a
            broken download rather than a security prompt. Signing needs an Apple Developer
            Program membership; until that exists, build from source:

            ```sh
            git clone https://github.com/gabmichels/worktrunk-deck.git
            cd worktrunk-deck && pnpm install && pnpm tauri build
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
